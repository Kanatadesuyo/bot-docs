<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プライバシーポリシー</title>
    <style>body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; }</style>
</head>
<body>
    <h1>[Bot名] プライバシーポリシー</h1>
    <p>本ポリシーは、本Botが取得する個人情報およびデータの取り扱いについて説明するものです。</p>
    
    <h2>1. 取得するデータ</h2>
    <p>本Botは、機能提供のために以下のデータを取得・利用する場合があります：ユーザーID、サーバーID、およびコマンド入力内容。</p>
    
    <h2>2. データの利用目的</h2>
    <p>取得したデータは、Botの機能実行、およびエラー発生時の原因調査の目的にのみ使用します。</p>

    <h2>3. データの管理と削除</h2>
    <p>取得したデータは適切に管理し、不要になったデータは速やかに削除します。また、第三者への提供は行いません。</p>
</body>
</html>
